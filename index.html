Save this code as `index.html` in VS Code.

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .profile {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #764ba2;
            margin-bottom: 25px;
        }

        .details {
            text-align: left;
            background: #f5f3ff;
            padding: 15px;
            border-radius: 12px;
            line-height: 2;
            margin-bottom: 20px;
        }

        .details p {
            color: #444;
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            transform: scale(1.05);
        }

        footer {
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="profile">M</div>

        <h1>Meganathan</h1>
        <p class="subtitle">M.Sc Computer Science Student</p>

        <div class="details">
            <p><b>🎓 Course:</b> M.Sc CS</p>
            <p><b>📅 Year:</b> 2025–2027</p>
            <p><b>📍 City:</b> Salem</p>
            <p><b>💻 Skill:</b> HTML & CSS</p>
        </div>

        <button onclick="showMessage()">Say Hello 👋</button>

        <footer>© 2026 Student Profile</footer>
    </div>

    <script>
        function showMessage() {
            alert("Welcome to my Student Profile!");
        }
    </script>

</body>
</html>
```
